name: Checks and Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Validate packs
        run: npm run validate

      - name: Run tests
        run: npm run test

      - name: Build add-on
        run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: lilys-money-build
          path: builds/*.mcaddon
          if-no-files-found: error
